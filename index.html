<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Task Scheduler</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #3b82f6;
        --primary-dark: #1d4ed8;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f5;
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }

      .title-group h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .title-group p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .badge {
        background: rgba(59, 130, 246, 0.12);
        color: var(--primary-dark);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 700;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 28px;
      }

      .stat-card,
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .stat-card {
        padding: 20px 22px;
      }

      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .stat-value {
        font-size: clamp(1.5rem, 2vw, 2.3rem);
        font-weight: 800;
        margin-top: 12px;
      }

      .panel {
        padding: 22px;
      }

      .panel h2 {
        margin: 0 0 18px;
        font-size: 1.35rem;
      }

      .schedule-list {
        display: grid;
        gap: 14px;
      }

      .schedule-item {
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr 0.9fr 0.5fr;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        background: #f9fbff;
      }

      .task-name {
        font-weight: 700;
      }

      .task-meta {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 700;
      }

      .pill.priority {
        background: rgba(59, 130, 246, 0.12);
        color: var(--primary-dark);
      }

      .pill.warning {
        background: rgba(245, 158, 11, 0.14);
        color: #a16207;
      }

      .pill.success {
        background: rgba(34, 197, 94, 0.12);
        color: var(--success);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
      }

      th {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .deadline-warning {
        color: var(--danger);
        font-weight: 700;
      }

      .heap-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        background: linear-gradient(135deg, #f8fbff 0%, #eff6ff 100%);
      }

      .heap-item {
        font-size: 1.4rem;
        font-weight: 800;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .schedule-item {
          grid-template-columns: 1fr 1fr;
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title-group">
          <h1>Smart Task Scheduler</h1>
          <p>Priority-driven scheduling with deadline awareness</p>
        </div>
        <div class="badge" id="top-heap-item">Top priority: --</div>
      </div>

      <div class="dashboard">
        <div class="stat-card">
          <span class="stat-label">Total Tasks</span>
          <div class="stat-value" id="total-tasks">0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">Schedules Created</span>
          <div class="stat-value" id="schedule-count">0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">Missed Deadlines</span>
          <div class="stat-value" id="deadline-misses">0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">Highest Score</span>
          <div class="stat-value" id="best-score">0</div>
        </div>
      </div>

      <section class="panel" style="margin-bottom: 28px;">
        <h2>Generated Schedule</h2>
        <div id="schedule-list" class="schedule-list"></div>
      </section>

      <section class="panel" style="margin-bottom: 28px;">
        <h2>Priority Queue Snapshot</h2>
        <div class="heap-box">
          <div>
            <div class="muted">Current max-priority item</div>
            <div class="heap-item" id="heap-top">--</div>
          </div>
          <div class="pill success" id="heap-rank">--</div>
        </div>
      </section>

      <section class="panel">
        <h2>Task Details</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Task</th>
                <th>Priority</th>
                <th>Category</th>
                <th>Deadline</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody id="task-table"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      async function loadDashboard() {
        const response = await fetch('/api/tasks');
        const data = await response.json();

        const tasks = data.tasks || [];
        const schedule = data.schedule || [];
        const heapTop = data.top_heap_item || 'N/A';

        document.getElementById('total-tasks').textContent = tasks.length;
        document.getElementById('schedule-count').textContent = schedule.length;
        document.getElementById('deadline-misses').textContent = schedule.filter(item => item.misses_deadline).length;
        document.getElementById('best-score').textContent = schedule.length ? Math.max(...schedule.map(item => Number(item.score))).toFixed(2) : '0.00';
        document.getElementById('top-heap-item').textContent = 'Top priority: ' + heapTop;
        document.getElementById('heap-top').textContent = heapTop;
        document.getElementById('heap-rank').textContent = 'Max Heap';

        const scheduleList = document.getElementById('schedule-list');
        scheduleList.innerHTML = schedule.map((entry) => {
          const statusClass = entry.misses_deadline ? 'warning' : 'success';
          const statusText = entry.misses_deadline ? 'Late' : 'On track';
          const start = new Date(entry.start);
          const end = new Date(entry.end);

          return `
            <div class="schedule-item">
              <div>
                <div class="task-name">${entry.task}</div>
                <div class="task-meta">Priority ${entry.priority} • ${entry.category}</div>
              </div>
              <div><strong>${start.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' })}</strong></div>
              <div><strong>${end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong></div>
              <div><span class="pill priority">Score ${Number(entry.score).toFixed(2)}</span></div>
              <div><span class="pill ${statusClass}">${statusText}</span></div>
            </div>
          `;
        }).join('');

        const taskTable = document.getElementById('task-table');
        taskTable.innerHTML = tasks.map((task) => {
          const deadline = new Date(task.deadline);
          return `
            <tr>
              <td>${task.name}</td>
              <td>${task.priority}</td>
              <td>${task.category}</td>
              <td>${deadline.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
              <td>${task.duration}h</td>
            </tr>
          `;
        }).join('');
      }

      loadDashboard();
    </script>
  </body>
</html>
